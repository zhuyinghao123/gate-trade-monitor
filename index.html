<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e11" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="实时监控 BTC/USDT K线与 Gate 交易操作" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gate监控" />
  <title>Gate BTC 交易监控</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <img class="brand-icon" src="icons/icon-192.png" width="36" height="36" alt="" />
          <div>
            <h1>Gate 交易监控</h1>
            <p class="sub">BTC / USDT · 现货 K 线</p>
          </div>
        </div>
        <div class="live" id="liveBadge" title="行情自动刷新">
          <span class="dot" aria-hidden="true"></span>
          <span id="liveText">连接中</span>
        </div>
      </div>
      <div class="price-row">
        <div>
          <div class="last-price" id="lastPrice">--</div>
          <div class="chg" id="changePct">24h --</div>
        </div>
        <div class="ohlc">
          <div><span>24h 高</span><b id="high24">--</b></div>
          <div><span>24h 低</span><b id="low24">--</b></div>
        </div>
      </div>
    </header>

    <section class="panel chart-panel">
      <div class="panel-head">
        <div class="tabs" role="tablist" aria-label="K线周期">
          <button type="button" class="tab active" data-interval="1m" aria-selected="true">1 分钟</button>
          <button type="button" class="tab" data-interval="5m" aria-selected="false">5 分钟</button>
        </div>
        <div class="meta" id="chartMeta">正在加载 K 线…</div>
      </div>
      <div id="chart" class="chart" role="img" aria-label="BTC/USDT K线图"></div>
      <canvas id="fallbackChart" class="chart fallback-chart" hidden></canvas>
    </section>

    <a class="panel event-card" id="eventLink" href="https://www.gate.com/trade-events/btc-updown-5m" target="_blank" rel="noopener noreferrer">
      <div>
        <div class="kicker">事件合约</div>
        <div class="event-title" id="eventTitle">BTC 5分钟涨跌</div>
        <div class="event-desc">BTC 5 Min Up or Down · 点此打开 Gate 下单页</div>
      </div>
      <span class="go">打开</span>
    </a>

    <section class="panel status-panel">
      <div class="panel-head">
        <h2>账户与机器人</h2>
        <span class="meta" id="statusUpdated">同步中…</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span>现货可用</span>
          <b id="spotUsdt">--</b>
        </div>
        <div class="stat">
          <span>登录状态</span>
          <b id="loginState">--</b>
        </div>
      </div>
      <div class="bot-status" id="botStatus">--</div>
      <p class="note" id="accountNote"></p>
    </section>

    <section class="panel log-panel">
      <div class="panel-head">
        <h2>操作记录</h2>
        <span class="meta" id="tradeCount">0 条</span>
      </div>
      <ul class="trades" id="tradeList"></ul>
    </section>

    <p class="foot">行情来自 Gate 公开接口，约每 5 秒自动刷新。本页不含任何密钥或登录信息。</p>
  </div>
  <script src="vendor/lightweight-charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
